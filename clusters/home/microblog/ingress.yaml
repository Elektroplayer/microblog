apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microblog
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - electr0.net
      secretName: microblog-tls
  rules:
    - host: electr0.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microblog
                port:
                  number: 80
